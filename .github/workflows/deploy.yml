name: Deploy Site (The Gallery)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Check for Art Data Branch
        id: check-branch
        run: |
          if git ls-remote --exit-code --heads origin art-data; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Art Data
        if: steps.check-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/heads/art-data
          path: public/data
          fetch-tags: false

      - name: Verify art data is usable
        run: |
          if [ ! -s public/data/theater/_manifest.json ]; then
            echo "::error::public/data/theater/_manifest.json is missing or empty after the art-data checkout — refusing to deploy a site with no theater data. Check that the art-data branch exists and theater_bake.yml has published to it."
            exit 1
          fi
          echo "art-data verified: $(find public/data -type f | wc -l) files staged"

      - name: Rebuild integrated painting records from scratch
        run: |
          rm -rf public/data/integrated
          python3 scripts/integrate_painting_bakes.py --public-root public --strict

      - name: Install verification dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/verification-requirements.txt

      - name: Validate canonical painting records
        run: python3 scripts/validate_integrated_records.py --public-root public

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Source-level verification intentionally does not require generated
      # art-data, so `npm run verify` also works in a normal main checkout.
      - name: Verify repository and build
        run: npm run verify

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
