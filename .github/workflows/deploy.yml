name: Deploy Site (The Gallery)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    # Must exactly match the target workflows' `name:` fields. Watching
    # only "Process Art (Turbo 56)" (that workflow's stroke/grind output,
    # which the frontend doesn't even read) meant a "Theater Bake" run —
    # the ACTUAL publisher of the painting/depth/hinge-graph data the site
    # renders — never triggered a redeploy: new theater data could land on
    # art-data and sit there until something else happened to push to main
    # or someone noticed and dispatched this workflow by hand.
    workflows: ["Process Art (Turbo 56)", "Theater Bake"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Check for Art Data Branch
        id: check-branch
        run: |
          if git ls-remote --exit-code --heads origin art-data; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Art Data
        if: steps.check-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/heads/art-data
          path: public/data
          fetch-tags: false

      # Consuming-side sanity check (not the full validate_output.py
      # schema check — that runs on the producing side, in
      # theater_bake.yml, before this data ever reaches art-data).
      # Previously a missing/empty art-data checkout was either silently
      # skipped (branch absent) or produced an empty public/data with no
      # warning at all — the site would then deploy showing the
      # flat-fallback plane for every painting with no CI signal. Fail
      # loudly instead.
      - name: Verify art data is usable
        run: |
          if [ ! -s public/data/theater/_manifest.json ]; then
            echo "::error::public/data/theater/_manifest.json is missing or empty after the art-data checkout — refusing to deploy a site with no theater data. Check that the art-data branch exists and theater_bake.yml has published to it."
            exit 1
          fi
          echo "art-data verified: $(find public/data -type f | wc -l) files staged"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # Legacy graph.json fallback (Scene.jsx uses it when the theater
      # manifest is missing/empty): self-repairs public/graph.json by
      # dropping nodes with no matching public/assets/ image and bridging
      # edges around them. Only touches this ephemeral checkout, not the
      # repo.
      - name: Verify legacy graph.json against assets
        run: npm run verify-assets

      - name: Build
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
