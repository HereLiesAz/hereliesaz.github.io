name: Deploy Site (The Gallery)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Bakes and removals publish to the art-data branch, which this workflow does
  # not watch (it listens to main). Rebuilding on a schedule picks them up even
  # when nobody presses "deploy now" in the admin.
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check for Art Data Branch
        id: check-branch
        run: |
          if git ls-remote --exit-code --heads origin art-data; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Art Data
        if: steps.check-branch.outputs.exists == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/art-data
          path: public/data
          fetch-tags: false

      - name: Verify art data is usable
        run: |
          if [ ! -s public/data/theater/_manifest.json ]; then
            echo "::error::public/data/theater/_manifest.json is missing or empty after the art-data checkout — refusing to deploy a site with no theater data. Check that the art-data branch exists and theater_bake.yml has published to it."
            exit 1
          fi
          echo "art-data verified: $(find public/data -type f | wc -l) files staged"

      - name: Rebuild integrated painting records from scratch
        run: |
          rm -rf public/data/integrated
          python3 scripts/integrate_painting_bakes.py --public-root public --strict

      - name: Install verification dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/verification-requirements.txt

      - name: Validate canonical painting records
        run: python3 scripts/validate_integrated_records.py --public-root public

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Source-level verification intentionally does not require generated
      # art-data, so `npm run verify` also works in a normal main checkout.
      - name: Verify repository and build
        run: npm run verify

      # GitHub Pages rejects published sites over 1 GB. vite.config.js drops
      # everything the runtime never fetches (scripts/ship-filter.mjs); this
      # fails the build with a clear message before the upload does.
      - name: Check site size
        run: |
          size_mb=$(du -sm dist | cut -f1)
          echo "dist is ${size_mb} MB"
          if [ "$size_mb" -gt 900 ]; then
            echo "::error::dist is ${size_mb} MB; GitHub Pages rejects sites over 1 GB (limit checked at 900 MB). Largest entries:"
            du -sm dist/* dist/data/* 2>/dev/null | sort -rn | head -10
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
