name: Deploy Site (The Gallery)

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    # Theater Bake publishes the live paper-theater dataset to art-data.
    # Remove Painting mutates that same branch. Either operation must be
    # followed by a deploy so the built site consumes the new art-data tree.
    workflows: ["Theater Bake", "Remove Painting"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Check for Art Data Branch
        id: check-branch
        run: |
          if git ls-remote --exit-code --heads origin art-data; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Art Data
        if: steps.check-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/heads/art-data
          path: public/data
          fetch-tags: false

      # Consuming-side sanity check (not the full validate_output.py
      # schema check — that runs on the producing side before this data
      # reaches art-data).
      - name: Verify art data is usable
        run: |
          if [ ! -s public/data/theater/_manifest.json ]; then
            echo "::error::public/data/theater/_manifest.json is missing or empty after the art-data checkout — refusing to deploy a site with no theater data. Check that the art-data branch exists and Theater Bake has published to it."
            exit 1
          fi
          echo "art-data verified: $(find public/data -type f | wc -l) files staged"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # Legacy graph.json remains a defensive fallback for paintings that
      # do not yet have theater data.
      - name: Verify legacy graph.json against assets
        run: npm run verify-assets

      - name: Build
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
