name: Build & Publish Android APK
run-name: Android release ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || github.sha }} ${{ github.event_name == 'workflow_dispatch' && inputs.version || format('1.0.0.{0}', github.run_number) }}

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-release-apk.yml"
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      request_id:
        required: true
        type: string
      notes:
        required: false
        type: string
        default: ""
      prerelease:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    uses: HereLiesAz/workflows/.github/workflows/hereliesaz-admin-apk-build.yml@main
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || format('1.0.0.{0}', github.run_number) }}
      request_id: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || format('auto-{0}', github.sha) }}
      notes: ${{ github.event_name == 'workflow_dispatch' && inputs.notes || format('Automatic Android release for {0}', github.sha) }}
      prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
    secrets: inherit
