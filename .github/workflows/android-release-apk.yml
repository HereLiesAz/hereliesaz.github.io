name: Build Android APK for In-App Release
run-name: Android APK build ${{ inputs.request_id }} ${{ inputs.version }}

# This workflow never publishes a GitHub Release and receives no publish
# credential. The Android admin app dispatches it with the user's saved
# gh_token, waits for this artifact, then publishes the release itself.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version being built"
        required: true
        type: string
      request_id:
        description: "Unique request id generated by the Android app"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --build-cache --no-daemon --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --build-cache --no-daemon --stacktrace

      - name: Prepare APK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SAFE_VERSION="$(printf '%s' "$VERSION" | tr -c '0-9A-Za-z._-' '-')"
          cp app/build/outputs/apk/debug/app-debug.apk "HereLiesAz-Admin-$SAFE_VERSION.apk"

      - name: Upload APK for the requesting app
        uses: actions/upload-artifact@v4
        with:
          name: admin-apk-${{ inputs.request_id }}
          path: HereLiesAz-Admin-*.apk
          if-no-files-found: error
          retention-days: 7
