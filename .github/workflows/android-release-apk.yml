name: Publish Android APK Release

# Publishing is deliberately manual. This workflow never publishes with
# github.token / GITHUB_TOKEN. A separately saved repository secret named
# GH_TOKEN is required and is the only credential exposed to gh.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.1"
        required: true
        type: string
      prerelease:
        description: "Mark this GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean
      notes:
        description: "Optional release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require persisted GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Repository secret GH_TOKEN is not saved. Publishing is intentionally blocked until you add a persistent GH_TOKEN secret."
            exit 1
          fi
          echo "::add-mask::$GH_TOKEN"

      - name: Checkout without persisting Actions credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --build-cache --no-daemon --stacktrace

      - name: Build installable APK
        run: ./gradlew assembleDebug --build-cache --no-daemon --stacktrace

      - name: Prepare release asset
        id: asset
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$VERSION" | tr -cd '0-9A-Za-z._-')"
          [[ -n "$VERSION" ]] || { echo "::error::version became empty after sanitizing"; exit 1; }
          TAG="admin-v$VERSION"
          ASSET="HereLiesAz-Admin-$VERSION.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Verify GH_TOKEN can publish this repository
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$GH_TOKEN"
          push="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push // false')"
          if [[ "$push" != "true" ]]; then
            echo "::error::Saved GH_TOKEN can authenticate but does not have write access to $GITHUB_REPOSITORY."
            exit 1
          fi

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ steps.asset.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$GH_TOKEN"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Choose a new version; this workflow will not silently replace a published APK."
            exit 1
          fi

      - name: Publish GitHub Release with saved GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ steps.asset.outputs.tag }}
          ASSET: ${{ steps.asset.outputs.asset }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$GH_TOKEN"

          args=(
            release create "$TAG"
            "$ASSET#HereLiesAz Admin APK $VERSION"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "HereLiesAz Admin $VERSION"
          )

          if [[ -n "$NOTES" ]]; then
            args+=(--notes "$NOTES")
          else
            args+=(--notes "Native HereLiesAz Admin Android release $VERSION.")
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"

      - name: Upload CI copy
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.asset.outputs.asset }}
          path: ${{ steps.asset.outputs.asset }}
          if-no-files-found: error
