name: Build Android APK for In-App Release
run-name: Android APK build ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || github.sha }} ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'automatic' }}

# Automatically builds the native Android app when its source/build files change.
# GitHub Release publication remains in-app only, using the gh_token saved on-device.
# This workflow never receives a GitHub publishing credential.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-release-apk.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version name being built"
        required: true
        type: string
      request_id:
        description: "Unique request id generated by the Android app"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Resolve build metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REQUEST_ID: ${{ inputs.request_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            REQUEST_ID="$INPUT_REQUEST_ID"
          else
            VERSION="0.0.$RUN_NUMBER"
            REQUEST_ID="auto-${HEAD_SHA:0:12}"
          fi
          SAFE_VERSION="$(printf '%s' "$VERSION" | tr -c '0-9A-Za-z._-' '-')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "safe_version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Require stable Android signing material
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${KEYSTORE_B64:-}" ]] || { echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."; exit 1; }
          [[ -n "${KEYSTORE_PASSWORD:-}" ]] || { echo "::error::ANDROID_KEYSTORE_PASSWORD is not configured."; exit 1; }
          [[ -n "${KEY_ALIAS:-}" ]] || { echo "::error::ANDROID_KEY_ALIAS is not configured."; exit 1; }
          [[ -n "${KEY_PASSWORD:-}" ]] || { echo "::error::ANDROID_KEY_PASSWORD is not configured."; exit 1; }

      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/hereliesaz-admin-release.jks"

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --build-cache --no-daemon --stacktrace

      - name: Build signed release APK
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/hereliesaz-admin-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(( $(date +%s) - 1577836800 ))
          ./gradlew assembleRelease \
            -PreleaseVersionName="$VERSION" \
            -PreleaseVersionCode="$VERSION_CODE" \
            --build-cache --no-daemon --stacktrace

      - name: Prepare APK
        shell: bash
        env:
          SAFE_VERSION: ${{ steps.meta.outputs.safe_version }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "HereLiesAz-Admin-$SAFE_VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-apk-${{ steps.meta.outputs.request_id }}
          path: HereLiesAz-Admin-*.apk
          if-no-files-found: error
          retention-days: 7
