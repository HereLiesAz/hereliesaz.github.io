name: Build Android APK for In-App Release
run-name: Android APK build ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || github.sha }} ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'automatic' }}

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-release-apk.yml"
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      request_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: HereLiesAz/workflows/.github/workflows/hereliesaz-admin-apk-build.yml@main
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || format('0.0.{0}', github.run_number) }}
      request_id: ${{ github.event_name == 'workflow_dispatch' && inputs.request_id || format('auto-{0}', github.sha) }}
      release_signed: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
