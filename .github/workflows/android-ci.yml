name: Android CI
on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", "gradle/wrapper/**", "gradlew", "gradlew.bat", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", "gradlew", "gradlew.bat", ".github/workflows/android-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --build-cache --no-daemon --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --build-cache --no-daemon --stacktrace
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: android-unit-test-reports, path: "app/build/reports/tests/", if-no-files-found: ignore }
      - if: success()
        uses: actions/upload-artifact@v4
        with: { name: hereliesaz-admin-debug-apk, path: "app/build/outputs/apk/debug/*.apk", if-no-files-found: error }
