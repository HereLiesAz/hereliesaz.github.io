name: Dedup Scan

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Dedup scan {0}', inputs.request_id) || 'Dedup scanner smoke test' }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request id from the Android admin
        required: true
        type: string
  pull_request:
    paths:
      - "scripts/dedup_scan.py"
      - ".github/workflows/dedup_scan.yml"

permissions:
  contents: read

concurrency:
  group: dedup-scan-${{ github.repository }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image readers
        run: python -m pip install --disable-pip-version-check Pillow pillow-heif

      - name: Compile scanner
        run: python -m py_compile scripts/dedup_scan.py

      - name: Verify exact and compressed-copy detection
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/assets"
          python - "$tmp/assets" <<'PY'
          from pathlib import Path
          import shutil
          import sys
          from PIL import Image, ImageDraw

          root = Path(sys.argv[1])
          image = Image.new("RGB", (640, 480), "white")
          draw = ImageDraw.Draw(image)
          draw.rectangle((40, 40, 600, 430), fill=(20, 40, 80))
          draw.ellipse((160, 90, 500, 420), fill=(220, 80, 40))
          draw.line((40, 430, 600, 40), fill=(250, 240, 80), width=18)
          image.save(root / "original.jpg", quality=96)
          shutil.copyfile(root / "original.jpg", root / "exact-copy.jpg")
          image.save(root / "compressed.jpg", quality=38, optimize=True)
          PY
          printf '{}\n' > "$tmp/meta.json"
          python scripts/dedup_scan.py \
            --assets "$tmp/assets" \
            --meta "$tmp/meta.json" \
            --output "$tmp/report.json"
          python - "$tmp/report.json" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          assert report["exactCount"] >= 1, report
          assert report["compressedCount"] >= 1, report
          print(json.dumps({
              "exact": report["exactCount"],
              "compressed": report["compressedCount"],
              "similar": report["similarCount"],
          }))
          PY

  scan:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image readers
        run: python -m pip install --disable-pip-version-check Pillow pillow-heif

      - name: Scan for duplicates and similar images
        run: |
          python scripts/dedup_scan.py \
            --assets public/assets \
            --meta public/meta.json \
            --output dedup-report.json

      - name: Upload dedup report
        uses: actions/upload-artifact@v4
        with:
          name: dedup-report-${{ inputs.request_id }}
          path: dedup-report.json
          if-no-files-found: error
          retention-days: 7
