name: Dedup Scan

run-name: Dedup scan ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique request id from the Android admin
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dedup-scan-${{ github.repository }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image readers
        run: python -m pip install --disable-pip-version-check Pillow pillow-heif

      - name: Scan for duplicates and similar images
        run: |
          python scripts/dedup_scan.py \
            --assets public/assets \
            --meta public/meta.json \
            --output dedup-report.json

      - name: Upload dedup report
        uses: actions/upload-artifact@v4
        with:
          name: dedup-report-${{ inputs.request_id }}
          path: dedup-report.json
          if-no-files-found: error
          retention-days: 7
