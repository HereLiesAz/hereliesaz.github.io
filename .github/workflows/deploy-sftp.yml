name: Deploy over SFTP

# Mirror the built site to your own host over SFTP (SSH file transfer).
# Runs on every push to main, and can be fired by hand from the Actions
# tab. Uses lftp's built-in SFTP implementation — not OpenSSH — because
# ProFTPD mod_sftp/0.9.9's password auth is incompatible with sshpass.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER      hostname, e.g. sftp.example.com. Named FTP_* for
#                   continuity with the earlier FTP setup — the ProFTPD
#                   mod_sftp host we deploy to accepts the same account
#                   for both protocols.
#   FTP_USERNAME    login user.
#   FTP_PASSWORD    login password (lftp handles the auth exchange).
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   SFTP_PORT         defaults to 22.
#   FTP_SERVER_DIR    remote path to mirror the built site into.
#                     Defaults to /public_html/. If your host serves from
#                     a subfolder (e.g. /portfolio/), also change `base`
#                     in vite.config.js to match, or the JS/CSS
#                     <script>/<link> tags will 404.
#
# The site's baked data lives on the orphan `art-data` branch and is
# injected into public/data at build time (same pattern as deploy.yml).
# Without that step the site would render the flat-fallback plane
# instead of the paper theater.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sftp-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source (main)
        uses: actions/checkout@v4
        with:
          path: main

      - name: Check out baked data (art-data)
        uses: actions/checkout@v4
        with:
          ref: art-data
          path: art-data
        continue-on-error: true

      - name: Stage baked data into public/data
        run: |
          if [ -d art-data ] && [ -n "$(ls -A art-data 2>/dev/null | grep -v '^\.git$')" ]; then
            mkdir -p main/public/data
            # Mirror everything from art-data except its git metadata.
            rsync -a --exclude='.git' art-data/ main/public/data/
            echo "staged $(find main/public/data -type f | wc -l) data files"
          else
            echo "::warning::art-data branch is empty or missing — site will use flat fallback for every painting"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main/package-lock.json

      - name: Install
        working-directory: main
        run: npm ci

      - name: Build
        working-directory: main
        run: npm run build
        
      - name: Deploy via lftp (SFTP)
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PORT: ${{ vars.SFTP_PORT || '22' }}
          REMOTE_DIR: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
        run: |
          set -e
          sudo apt-get install -y lftp

          USER_TRIMMED=$(printf '%s' "$USERNAME" | tr -d ' \t\r\n')
          PW_TRIMMED=$(printf '%s' "$PASSWORD" | tr -d '\r\n')
          echo "[diag] username length raw=$(printf '%s' "$USERNAME" | wc -c) trimmed=$(printf '%s' "$USER_TRIMMED" | wc -c)"
          echo "[diag] password length raw=$(printf '%s' "$PASSWORD" | wc -c) trimmed=$(printf '%s' "$PW_TRIMMED" | wc -c)"
          echo "[diag] host: $(printf '%s' "$HOST" | wc -c) chars, port: $PORT"

          # lftp has its own SFTP implementation (not OpenSSH) which
          # handles ProFTPD mod_sftp password auth reliably — bypasses
          # the sshpass/OpenSSH incompatibility we hit earlier.
          lftp -u "$USER_TRIMMED","$PW_TRIMMED" \
            -p "$PORT" \
            -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; mirror -R --verbose ./main/dist/ $REMOTE_DIR; quit" \
            sftp://"$HOST"
