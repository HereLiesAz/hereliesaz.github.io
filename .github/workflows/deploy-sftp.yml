name: Deploy over SFTP

# Deploy the same Vite gallery used by GitHub Pages to hereliesaz.com.
# This repository is intentionally local instead of using the generic
# central Jekyll SFTP workflow because the gallery requires the art-data
# branch and a Vite build.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sftp-deploy-hereliesaz-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check for Art Data Branch
        id: check-branch
        run: |
          if git ls-remote --exit-code --heads origin art-data; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Art Data
        if: steps.check-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/heads/art-data
          path: public/data
          fetch-tags: false

      - name: Verify art data is usable
        run: |
          if [ ! -s public/data/theater/_manifest.json ]; then
            echo "::error::public/data/theater/_manifest.json is missing or empty after the art-data checkout — refusing to deploy hereliesaz.com without theater data."
            exit 1
          fi
          echo "art-data verified: $(find public/data -type f | wc -l) files staged"

      - name: Rebuild integrated painting records from scratch
        run: |
          rm -rf public/data/integrated
          python3 scripts/integrate_painting_bakes.py --public-root public --strict

      - name: Install verification dependencies
        run: python3 -m pip install --disable-pip-version-check -r scripts/verification-requirements.txt

      - name: Validate canonical painting records
        run: python3 scripts/validate_integrated_records.py --public-root public

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify repository and build Vite site
        run: npm run verify

      - name: Deploy dist via lftp (SFTP)
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USERNAME: ${{ secrets.FTP_USERNAME }}
          PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PORT: ${{ vars.SFTP_PORT || '22' }}
          REMOTE_DIR: ${{ vars.FTP_SERVER_DIR || '/app' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lftp

          USER_TRIMMED=$(printf '%s' "$USERNAME" | tr -d ' \t\r\n')
          PW_TRIMMED=$(printf '%s' "$PASSWORD" | tr -d '\r\n')

          lftp -u "$USER_TRIMMED","$PW_TRIMMED" \
            -p "$PORT" \
            -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; mirror -R --verbose ./dist/ $REMOTE_DIR; quit" \
            sftp://"$HOST"
