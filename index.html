<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperPlanes - Temporal Bleed</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #ddd;
            overflow-x: hidden;
            font-family: 'Courier New', Courier, monospace;
            height: 400vh; /* Sufficient depth for the descent */
        }

        .theater-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            perspective: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .paper-layer {
            position: fixed;
            width: 60vw;
            height: 60vh;
            background-color: #111;
            border: 1px solid #333;
            box-shadow: inset 0 0 50px #000, 0 20px 50px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 0.5rem;
            will-change: transform;
            filter: grayscale(100%);
        }

        /* The Parasite */
        .temporal-bleed {
            position: absolute;
            pointer-events: none;
            opacity: 0.7;
            filter: grayscale(100%) contrast(250%) brightness(80%) blur(1px);
            mix-blend-mode: difference;
            animation: temporal-decay 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            z-index: 9999;
            will-change: transform, opacity, filter;
        }

        @keyframes temporal-decay {
            0% {
                opacity: 0.7;
                filter: grayscale(100%) contrast(250%) brightness(80%) blur(1px);
            }
            100% {
                opacity: 0;
                transform: scale(1.02) translateY(20px);
                filter: grayscale(100%) contrast(300%) brightness(50%) blur(8px);
            }
        }
    </style>
</head>
<body>

    <div class="theater-container">
        <div class="paper-layer" id="plane-zero">Subject Zero</div>
    </div>

    <script>
        class GhostState {
            constructor(targetSelector = '.paper-layer') {
                this.targetSelector = targetSelector;
                this.container = document.body;
                this.ticking = false;
                this.initScrollGhosts();
            }

            initScrollGhosts() {
                let lastScroll = window.scrollY;
                window.addEventListener('scroll', () => {
                    const currentScroll = window.scrollY;
                    const delta = currentScroll - lastScroll;
                    
                    if (Math.abs(delta) > 5 && !this.ticking) {
                        window.requestAnimationFrame(() => {
                            this.spawnGhost(delta);
                            this.ticking = false;
                        });
                        this.ticking = true;
                    }
                    lastScroll = currentScroll;
                });
            }

            spawnGhost(velocity) {
                const targets = document.querySelectorAll(this.targetSelector);
                if (!targets.length) return;

                targets.forEach(target => {
                    const rect = target.getBoundingClientRect();
                    const ghost = target.cloneNode(true);
                    
                    ghost.classList.add('temporal-bleed');
                    ghost.style.top = `${rect.top + window.scrollY}px`;
                    ghost.style.left = `${rect.left}px`;
                    ghost.style.width = `${rect.width}px`;
                    ghost.style.height = `${rect.height}px`;
                    
                    // Invert the physical drag against the scroll velocity
                    ghost.style.transform = `translateY(${-velocity * 0.8}px)`;

                    this.container.appendChild(ghost);

                    // Let it rot
                    setTimeout(() => ghost.remove(), 800);
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new GhostState();
            
            // Forced parallax descent
            const layer = document.getElementById('plane-zero');
            window.addEventListener('scroll', () => {
                const scrolled = window.scrollY;
                layer.style.transform = `translateY(${scrolled * 0.4}px) scale(${1 - scrolled * 0.0002}) rotateX(${scrolled * 0.02}deg)`;
            });
        });
    </script>
</body>
</html>
