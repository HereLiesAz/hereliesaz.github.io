        /* Reduced motion, DOM half: this only reaches the DOM overlay layer
           — CSS cannot touch the WebGL canvas. The canvas half lives in
           JS: AnamorphicCam.jsx switches to each segment's calm camera
           route and TheaterPainting.jsx zeroes the shard scatter (see
           src/utils/reducedMotion.js). */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }
