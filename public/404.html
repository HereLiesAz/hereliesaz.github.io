<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#000000" />
<title>HereLiesAz</title>
<style>html, body { margin: 0; background: #000; color: #f4f0e6; }</style>
</head>
<body>
<script>
  // GitHub Pages serves this file (with a real 404 status) for any path
  // that isn't a real file on disk — which includes every client-side
  // route (/admin, /projects) on a direct navigation or reload, since
  // there's no server-side SPA fallback here the way the Apache/.htaccess
  // deploy target already has. Stash the intended path and bounce to the
  // real app shell, which restores it before the router mounts (see
  // main.jsx). Standard technique: https://github.com/rafgraph/spa-github-pages
  try {
    sessionStorage.setItem('spaRedirect', location.pathname + location.search + location.hash);
  } catch (e) { /* storage unavailable — redirect to "/" anyway, just without restoring the path */ }
  location.replace('/');
</script>
<noscript><p style="font-family: Georgia, serif; padding: 2rem;">Page not found. <a href="/" style="color: #f4f0e6;">Go to the gallery</a>.</p></noscript>
</body>
</html>
